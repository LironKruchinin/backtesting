source = "https://www.cmegroup.com/markets/metals/precious/gold.contractSpecs.html"

[calendar.reference_span]
start = "2016-01-01"
end = "2026-01-01"
rationale = """
Ten whole calendar years, entirely inside the one session era this table \
describes. Same reasoning as the energy calendar above, and deliberately the \
same span so the two annualization factors differ only where the exchanges \
do."""

