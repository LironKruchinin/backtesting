# CME Globex session calendars for energy, metals, FX and interest rates.
#
# Four products, four calendars, and they are four because the archive says the
# four differ — not because four exchanges happen to be named. Everything below
# was measured with `crates/crucible-data/examples/session_profile.rs` over
# 2010-06-06..2026-07-28 of this project's own `ohlcv-1m` archive (CL 247
# contracts / 29.5 M bars, GC 221 / 10.3 M, 6E 149 / 7.0 M, ZN 68 / 6.1 M) and
# then cross-checked against published hours. `docs/SESSION_ERAS.md` is the
# workbook; §5 is these four tables. Where measurement and publication disagree
# the archive wins and the disagreement is written down here.
#
# ## All four calendars now start at the archive's first date
#
# `valid_from = "2010-06-06"` on every one of them, which is the Sunday the
# archive opens; each product's first bar is that evening, at exactly the open
# its oldest era claims. Before D-0089 three of the four
# started 2015-09-21 and the fourth 2011-10-03, so 5.3 of the archive's 16.1
# years were measured against a template that did not describe them — about 145
# of the first 423 contracts a sweep touches.
#
# ## What is the same across all four
#
# Sunday evening through Friday afternoon, with a break each day between the
# close and the next open, and **no intraday halt in any era**. The 15:15-15:30
# CT halt that equity index carried until 2021-06-28 never existed for any of
# these four: the window traded on essentially every session of the archive for
# CL, GC, 6E and ZN, in every year from 2010.
#
# ## Session eras, one line each
#
#   CL, GC   2010-06-06 .. 2015-09-18   17:00 -> 16:15 CT
#            2015-09-21 ..              17:00 -> 16:00 CT   <- [calendar.session]
#   6E       2010-06-06 ..              17:00 -> 16:00 CT   (no era change)
#   ZN       2010-06-06 .. 2011-09-30   17:30 -> 16:00 CT
#            2011-10-03 ..              17:00 -> 16:00 CT   <- [calendar.session]
#
# * **CL, GC — the close moved 16:15 -> 16:00 CT on 2015-09-21**, the same date
#   and the same advisory as equity index. The 16:00-16:15 CT window traded on
#   all 78 Mon-Fri dates from 2015-06-01 to 2015-09-18 and on none of the 200
#   from 2015-09-21 to 2016-06-29, for both roots. Going the other way, the same
#   window traded on 263 of the 276 Mon-Fri dates from 2010-06-07 to 2011-06-29
#   — the thirteen that did not are holidays and early closes — so the 16:15
#   close is evidenced back to the archive's first trading day and there is no
#   third era hiding in between.
# * **6E — no era change at all.** Open 17:00, close 16:00 for every one of the
#   sixteen years. The 2015-09-21 advisory did not touch it, and the archive
#   shows the 16:00-16:15 window silent on all 280 Mon-Fri dates spanning it.
# * **ZN — the open moved 17:30 -> 17:00 CT on Sunday 2011-10-02.** Sunday
#   evenings first traded at 17:30 through 2011-09-25 and at 17:00 from
#   2011-10-02, with no mixed week; on Mon-Fri, every minute from 16:01 to 17:29
#   is silent on all 338 trading dates of the older era and 17:30 trades on 80 %
#   of them. The close was 16:00 CT throughout. No CME document for this change
#   could be retrieved, so the boundary rests on the archive alone.
#
# The one third-party corroboration of the 2015 change also explains its
# product list: ATAS, "New changes on CME trading session", published
# 2015-09-20, accessed 2026-07-31 — "CME Equity, CBOT Equity, COMEX, NYMEX"
# moved their close from 16:15 to 16:00 CT effective 2015-09-21
# (https://atas.net/volume-analysis/new-changes-on-cme-trading-session/). CME
# FX and CBOT interest rates are not on that list, and the archive shows neither
# moving. That is the third case CLAUDE.md §7 asks for: the archive says CL and
# GC moved while 6E and ZN did not, and an independent source says which product
# groups the advisory covered.
#
# ## Holiday behaviour: four regimes, and none of them equity index's
#
# On the recurring US holidays (MLK, Presidents' Day, Memorial Day, Juneteenth,
# Independence Day, Labor Day, Thanksgiving), measured as the last traded minute
# before 17:00 CT, and with the closures also measured from the evening BEFORE
# each date, which a closure removes and an early close does not:
#
#   equity index (for comparison)   10:30 CT -> closures -> 12:00 CT
#   CL, GC   2010-06-06 .. 2012     12:15 CT
#   CL, GC   2012-11-22 .. 2014-02  FULL CLOSURE
#   CL, GC   2014-05-26 .. 2021     12:00 CT
#   CL, GC   2022 ..                13:30 CT
#   6E, ZN   2010-06-06 .. 2012     12:00 CT
#   6E, ZN   2012-11-22 .. 2014-02  FULL CLOSURE
#   ZN       2014-05-26 ..          12:00 CT
#   6E       2014-05-26 .. 2021     12:00 CT
#   6E       2022 ..                NO early close — the full session runs
#
# **The closure regime is the same nine dates for all four products** —
# 2012-11-22, 2013-01-21, 2013-02-18, 2013-05-27, 2013-07-04, 2013-09-02,
# 2013-11-28, 2014-01-20, 2014-02-17 — and it is `EVIDENCED` twice over on each:
# no day session, and no session on the evening before (the Sunday before a
# Monday holiday, the Wednesday before Thanksgiving). Memorial Day 2014-05-26
# closed at 12:00 CT with its Sunday eve open, which is where the switch back
# is; MLK and Presidents' Day stayed closures a year longer than the other four,
# exactly as they did for equity index.
#
# Note where the closure regime STARTS: Thanksgiving **2012**-11-22, not 2013.
# All four products, plus ES and NQ, have no day session on it and no evening on
# 2012-11-21.
#
# CME's own summary agrees with the modern half: "For Monday holidays, energy
# and metals futures at CME NYMEX and COMEX close early at 1:30 PM CT, while
# interest-rate and equity futures halt at 12:00 PM CT (noon)." It says nothing
# about FX, and the archive does: MLK 2022-01-17 traded 6E to 15:58 CT while ES
# stopped at 12:00, GC and CL at 13:30 and ZN at 12:00. Four products, four
# answers, on one date — which is the whole reason these are four tables.
#
# Good Friday is a full closure for all four in a normal year. In the years the
# Employment Situation release landed on Good Friday the products diverge again,
# and the archive is unambiguous about it:
#
#   2012-04-06 / 2015-04-03 / 2021-04-02 / 2023-04-07 / 2026-04-03
#     ES  abbreviated to 08:15 CT      6E, ZN  abbreviated to 10:15 CT
#     CL, GC  fully closed — no day session and no evening session
#
# 2012-04-06 is inside `valid_from` for both 6E and ZN now and is encoded as a
# one-off for both; before this change ZN's table claimed it was fully closed on
# a date the archive shows trading to 10:15 CT.
#
# ## Known gaps, all of them listed, all of them measured
#
# - **The last session before a holiday closed at 15:15 CT on 26 dates for 6E
#   and ZN and on 6 dates for CL and GC.** NOT encoded. Full lists, identical
#   for the two roots in each pair:
#
#     6E, ZN (26): 2010-07-02, 2010-09-03, 2010-10-08, 2010-11-24 (15:24/15:25),
#       2011-01-14, 2011-02-18, 2011-05-27, 2011-07-01, 2011-09-02, 2011-10-07,
#       2012-01-13, 2012-02-17, 2012-05-25, 2012-08-31, 2012-10-05, 2013-01-18,
#       2013-02-15, 2013-05-24, 2013-08-30, 2014-01-17, 2014-02-14, 2014-05-23,
#       2014-08-29, 2015-01-16, 2015-02-13, 2015-05-22
#     CL, GC (6): 2010-07-02, 2010-09-03, 2010-10-08, 2010-11-24 (15:25),
#       2010-12-31, 2011-01-14
#
#   No rule fits. The anchor set changes twice — every US holiday including
#   **Columbus Day in 2010, 2011 AND 2012** up to 2012-10-05, then only the four
#   Monday holidays, then nothing after 2015-05-22 — and Thanksgiving eve
#   appears in 2010 and not in 2011 or 2012. CL and GC stop after 2011-01-14
#   entirely. No CME document explaining any of it could be retrieved. The cost
#   of not encoding it is 45 min x 26 dates for 6E and ZN and 60 min x 6 for CL
#   and GC, reported by `crucible qa` as missing bars — against the ~20,000
#   minutes of REAL bars per contract that the old `valid_from = 2015-09-21`
#   reported as *outside any session*, which is the error that indicts the
#   calendar rather than the archive (D-0040). Refusing to guess a rule from a
#   pattern with three regimes and a hole in it is the cheaper error.
# - **The day-after-Thanksgiving close moved 12:45 -> 13:45 CT for CL and GC and
#   12:15 -> 13:45 CT for 6E, apparently in 2024.** The evidence is two years
#   (2024-11-29 and 2025-11-28) against twelve at the older time, and 2025-11-28
#   is also the Globex-outage date, so it is really one clean observation and
#   one contaminated one. Encoded with `first_year = 2024` and this sentence,
#   because a table that is wrong for the last two years is worse than one whose
#   newest rule rests on a thin sample and says so.
# - **Christmas Eve for 6E moved 12:15 -> 12:45 CT on the same two-year
#   evidence** (2024-12-24, 2025-12-24 at 12:45; 2019-12-24 and 2020-12-24 at
#   12:15; the years between fall on weekends or inside the 2021 closure).
# - **On a Friday holiday CL and GC close at 12:00 CT rather than 13:30**
#   (2025-07-04, 2026-06-19, 2026-07-03 — three for three). The effect kind
#   carries one close time and cannot say "13:30 unless the holiday is a
#   Friday", so 13:30 is encoded and the three dates are 90 minutes long in this
#   table. Listed rather than carried silently, and listed rather than
#   special-cased as one-offs, because the next Friday holiday would need
#   another one.
# - **2010-12-31 closed at 12:15 CT for 6E and ZN** and at 15:15 CT for CL and
#   GC, where equity index traded in full. A single New Year's Eve — no other
#   year in the archive shows it — so 6E and ZN carry it as a dated one-off
#   rather than as a rule, and CL and GC leave it in the 15:15 list above.
# - **The 2025-11-28 Globex outage is not encoded** for any root: the archive
#   shows all seven roots opening at 07:30 CT instead of 00:00 that morning, and
#   no CME-published notice could be retrieved.
# - **`rth_open_local` / `rth_close_local` are the one thing here NOT measured
#   from the archive.** They are the open-outcry floor hours these products
#   inherited, and open outcry ended for CL and GC on 2016-12-30; CME no longer
#   publishes a "regular trading hours" window for any of them. They are a
#   convention, cited below, and they are used only by `Calendar::session_of` to
#   label an instant `regular` or `overnight`. Nothing in `open_intervals`,
#   `is_open`, `is_trading_day` or `bars_per_year` reads them. Each era carries
#   the same pair, which is *more* defensible in the older eras than in the
#   current one: those eras are entirely before open outcry ended.
# - **Nothing before 2010-06-06 is described**, and nothing here is a claim
#   about it. The oldest era of each table starts at the archive's first date
#   because that is the oldest evidence there is, not because the exchange
#   changed that day.

schema_version = 1

# =========================================================================
# NYMEX energy
# =========================================================================

[[calendar]]
id = "cme_globex_energy"
description = "CME Globex NYMEX energy futures (CL and its micro)"
timezone = "America/Chicago"
roots = ["CL", "MCL"]
valid_from = "2010-06-06"
sources = [
  "https://www.cmegroup.com/markets/energy/crude-oil/light-sweet-crude.contractSpecs.html",
  "https://www.cmegroup.com/tools-information/lookups/advisories/electronic-trading/20150914.html",
  "https://www.cmegroup.com/trading-hours.html",
  "https://atas.net/volume-analysis/new-changes-on-cme-trading-session/ (published 2015-09-20, accessed 2026-07-31)",
]

# --- era 1: 2010-06-06 .. 2015-09-18 -------------------------------------
[[calendar.era]]
# 17:00 CT to 16:15 CT, a 45-minute break each day, no halt. The archive's
# first CL bar opens 2010-06-06 at 17:00 CT; 16:00-16:15 CT traded on 263 of
# 276 Mon-Fri dates from 2010-06-07 to 2011-06-29 and on 78 of 78 from
# 2015-06-01 to 2015-09-18.
from = "2010-06-06"
open_local = "17:00"
close_local = "16:15"
rth_open_local = "08:00"
rth_close_local = "13:30"
source = "archive: session_profile window CL 1m 2010-06-06 2011-06-30 16:00 16:15 (docs/SESSION_ERAS.md §5.1); ended by https://www.cmegroup.com/tools-information/lookups/advisories/electronic-trading/20150914.html"

# --- era 2: 2015-09-21 .. now --------------------------------------------
[calendar.session]
# Sunday 17:00 CT to Friday 16:00 CT, 16:00-17:00 CT break daily, no halt.
from = "2015-09-21"
open_local = "17:00"
close_local = "16:00"
rth_open_local = "08:00"
rth_close_local = "13:30"
source = "https://www.cmegroup.com/markets/energy/crude-oil/light-sweet-crude.contractSpecs.html"

[calendar.reference_span]
start = "2016-01-01"
end = "2026-01-01"
rationale = """
Ten whole calendar years, entirely inside the current session era, fixed \
forever so bars_per_year is reproducible on every machine. It starts after the \
2015-09-21 era boundary so no 16:15-close session is averaged in — a span \
crossing it would produce a number describing neither era — and both ends are \
year boundaries so leap years and weekday drift average out. The 2022 \
holiday-close change moves session *length* on nine days a year and does not \
change the session template, so it is not an era and the span may cross it."""

[[calendar.holiday]]
name = "New Year's Day"
rule = { kind = "fixed_date", month = 1, day = 1, observance = "sunday_to_monday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Good Friday"
# Fully closed even in the years the Employment Situation release lands on it —
# 2012-04-06, 2015-04-03, 2023-04-07 and 2026-04-03 all have no day session and
# no evening session in the archive, where ES ran to 08:15 CT and ZN to 10:15.
rule = { kind = "good_friday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Christmas Day"
rule = { kind = "fixed_date", month = 12, day = 25, observance = "nearest_weekday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

# --- the seven recurring US holidays, in four regimes --------------------
#
# Every entry below carries a first_year/last_year pair that does not overlap
# any other entry for the same rule, so which one fires never depends on file
# order. The 12:15 and closure regimes were added with
# D-0089; the 12:00 entries gained their `first_year`
# in the same change, because without one they would have answered for 2010
# through 2013 as well.

[[calendar.holiday]]
name = "Martin Luther King Jr. Day"
rule = { kind = "nth_weekday", month = 1, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "13:30" }
first_year = 2022
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Martin Luther King Jr. Day (noon era)"
rule = { kind = "nth_weekday", month = 1, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:00" }
first_year = 2015
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Martin Luther King Jr. Day (closure era)"
# 2013-01-21 and 2014-01-20: no day session, and the Sunday before each has no
# session either. Measured, not published.
rule = { kind = "nth_weekday", month = 1, weekday = "monday", nth = 3 }
effect = { kind = "closed" }
first_year = 2013
last_year = 2014
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Martin Luther King Jr. Day (12:15 era)"
# 2011-01-17 and 2012-01-16, both at 12:15 CT with the Sunday evening open.
rule = { kind = "nth_weekday", month = 1, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:15" }
last_year = 2012
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Presidents' Day"
rule = { kind = "nth_weekday", month = 2, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "13:30" }
first_year = 2022
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Presidents' Day (noon era)"
rule = { kind = "nth_weekday", month = 2, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:00" }
first_year = 2015
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Presidents' Day (closure era)"
rule = { kind = "nth_weekday", month = 2, weekday = "monday", nth = 3 }
effect = { kind = "closed" }
first_year = 2013
last_year = 2014
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Presidents' Day (12:15 era)"
rule = { kind = "nth_weekday", month = 2, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:15" }
last_year = 2012
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Memorial Day"
rule = { kind = "nth_weekday", month = 5, weekday = "monday", nth = -1 }
effect = { kind = "early_close", close_local = "13:30" }
first_year = 2022
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Memorial Day (noon era)"
rule = { kind = "nth_weekday", month = 5, weekday = "monday", nth = -1 }
effect = { kind = "early_close", close_local = "12:00" }
first_year = 2014
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Memorial Day (closure era)"
# One year only: 2013-05-27 is a closure, 2014-05-26 a 12:00 CT close with its
# Sunday eve open. Same year the equity-index calendar switches back.
rule = { kind = "nth_weekday", month = 5, weekday = "monday", nth = -1 }
effect = { kind = "closed" }
first_year = 2013
last_year = 2013
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Memorial Day (12:15 era)"
rule = { kind = "nth_weekday", month = 5, weekday = "monday", nth = -1 }
effect = { kind = "early_close", close_local = "12:15" }
last_year = 2012
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Juneteenth"
# Adopted from 2022, so it has no earlier regime to carry.
rule = { kind = "fixed_date", month = 6, day = 19, observance = "sunday_to_monday" }
effect = { kind = "early_close", close_local = "13:30" }
first_year = 2022
source = "https://www.cmegroup.com/notices/ser/2021/12/SER-8887.pdf"

[[calendar.holiday]]
name = "Independence Day"
rule = { kind = "fixed_date", month = 7, day = 4, observance = "nearest_weekday" }
effect = { kind = "early_close", close_local = "13:30" }
first_year = 2022
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Independence Day (noon era)"
rule = { kind = "fixed_date", month = 7, day = 4, observance = "nearest_weekday" }
effect = { kind = "early_close", close_local = "12:00" }
first_year = 2014
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Independence Day (closure era)"
rule = { kind = "fixed_date", month = 7, day = 4, observance = "nearest_weekday" }
effect = { kind = "closed" }
first_year = 2013
last_year = 2013
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Independence Day (12:15 era)"
# 2010-07-05 (observed), 2011-07-04 and 2012-07-04, all at 12:15 CT.
rule = { kind = "fixed_date", month = 7, day = 4, observance = "nearest_weekday" }
effect = { kind = "early_close", close_local = "12:15" }
last_year = 2012
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Labor Day"
rule = { kind = "nth_weekday", month = 9, weekday = "monday", nth = 1 }
effect = { kind = "early_close", close_local = "13:30" }
first_year = 2022
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Labor Day (noon era)"
rule = { kind = "nth_weekday", month = 9, weekday = "monday", nth = 1 }
effect = { kind = "early_close", close_local = "12:00" }
first_year = 2014
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Labor Day (closure era)"
rule = { kind = "nth_weekday", month = 9, weekday = "monday", nth = 1 }
effect = { kind = "closed" }
first_year = 2013
last_year = 2013
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Labor Day (12:15 era)"
rule = { kind = "nth_weekday", month = 9, weekday = "monday", nth = 1 }
effect = { kind = "early_close", close_local = "12:15" }
last_year = 2012
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Thanksgiving Day"
rule = { kind = "nth_weekday", month = 11, weekday = "thursday", nth = 4 }
effect = { kind = "early_close", close_local = "13:30" }
first_year = 2022
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Thanksgiving Day (noon era)"
rule = { kind = "nth_weekday", month = 11, weekday = "thursday", nth = 4 }
effect = { kind = "early_close", close_local = "12:00" }
first_year = 2014
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Thanksgiving Day (closure era)"
# Two years, and the first of them is 2012 rather than 2013: 2012-11-22 has no
# day session and 2012-11-21 has no evening. Thanksgiving is where the closure
# regime begins, for all four commodity roots and for equity index.
rule = { kind = "nth_weekday", month = 11, weekday = "thursday", nth = 4 }
effect = { kind = "closed" }
first_year = 2012
last_year = 2013
source = "archive: session_profile daily CL 1m 2012-11-15 2014-03-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Thanksgiving Day (12:15 era)"
# 2010-11-25 and 2011-11-24 only — 2012 is already a closure.
rule = { kind = "nth_weekday", month = 11, weekday = "thursday", nth = 4 }
effect = { kind = "early_close", close_local = "12:15" }
last_year = 2011
source = "archive: session_profile holidays CL 1m 2010-06-06 2016-01-01 (docs/SESSION_ERAS.md §5.3)"

[[calendar.holiday]]
name = "Day after Thanksgiving"
# 13:45 CT since 2024 on two observations; 12:45 CT on the twelve before it,
# which the archive shows unchanged from 2010-11-26 onwards.
rule = { kind = "day_after_nth_weekday", month = 11, weekday = "thursday", nth = 4 }
effect = { kind = "early_close", close_local = "13:45" }
first_year = 2024
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Day after Thanksgiving (12:45 era)"
rule = { kind = "day_after_nth_weekday", month = 11, weekday = "thursday", nth = 4 }
effect = { kind = "early_close", close_local = "12:45" }
last_year = 2023
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Christmas Eve"
# 12:45 CT on every observation the archive holds, from 2012-12-24 onwards; the
# earlier years fall on weekends or are absorbed by the Christmas Day closure.
