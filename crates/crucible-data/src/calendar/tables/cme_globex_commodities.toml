# =========================================================================
# CBOT interest rates
# =========================================================================

[[calendar]]
id = "cme_globex_rates"
description = "CME Globex CBOT US Treasury futures (ZN)"
timezone = "America/Chicago"
roots = ["ZN"]
valid_from = "2010-06-06"
sources = [
  "https://www.cmegroup.com/markets/interest-rates/us-treasury/10-year-us-treasury-note.contractSpecs.html",
  "https://www.cmegroup.com/trading-hours.html",
]

# --- era 1: 2010-06-06 .. 2011-09-30 -------------------------------------
[[calendar.era]]
# 17:30 -> 16:00 CT, a 90-minute break each day, no halt. `EVIDENCED`: across
# the 338 Mon-Fri trading dates from 2010-06-06 to 2011-09-25, every local
# minute from 16:01 to 17:29 has zero traded bars and 17:30 has them on 80 % of
# dates; every Sunday in that span first trades at 17:30 and every Sunday from
# 2011-10-02 at 17:00, with no mixed week. The 16:00 minute itself carries a
# settlement print on 47 % of dates, which is why the close is read off Friday
# (last traded minute 15:59) rather than off the Mon-Thu profile.
#
# No CME document for the boundary could be retrieved and none is cited: this
# era rests on the archive alone, and `docs/SESSION_ERAS.md` §6 lists the page
# that would settle it.
from = "2010-06-06"
open_local = "17:30"
close_local = "16:00"
rth_open_local = "07:20"
rth_close_local = "14:00"
source = "archive: session_profile minutes ZN 1m 2010-06-06 2011-09-26 15:55 17:40 and daily ZN 1m 2010-06-06 2012-03-01 Sun (docs/SESSION_ERAS.md §5.1) — UNVERIFIED against any CME publication"

# --- era 2: 2011-10-03 .. now --------------------------------------------
[calendar.session]
from = "2011-10-03"
open_local = "17:00"
close_local = "16:00"
rth_open_local = "07:20"
rth_close_local = "14:00"
source = "https://www.cmegroup.com/markets/interest-rates/us-treasury/10-year-us-treasury-note.contractSpecs.html"

[calendar.reference_span]
start = "2016-01-01"
end = "2026-01-01"
rationale = """
Ten whole calendar years, well inside the current session era and after the \
2010-2015 pre-holiday 15:15 CT closes the header lists, so none of those \
unencoded 45-minute days is averaged in."""

[[calendar.holiday]]
name = "New Year's Day"
rule = { kind = "fixed_date", month = 1, day = 1, observance = "sunday_to_monday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Good Friday"
# Closed in a normal year; the Employment-Situation years ran to 10:15 CT and
# are dated one-offs below, which take precedence.
rule = { kind = "good_friday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Christmas Day"
rule = { kind = "fixed_date", month = 12, day = 25, observance = "nearest_weekday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

# Neither Columbus Day nor Veterans Day appears here, and their absence is a
# measurement rather than an oversight. The cash Treasury market observes both
# (SIFMA recommends a full close), and `docs/THETADATA_PLAN.md` §8.1 records
# Veterans Day as a day the NYSE trades and the bond market does not — but CBOT
# Treasury *futures* on Globex traded a full session on every Columbus Day and
# every Veterans Day in the archive. Cash and futures are different markets and
# this table is about the futures. (The *day before* Columbus Day is a different
# question: ZN closed 15:15 CT on 2010-10-08, 2011-10-07 and 2012-10-05, which
# the header lists as unencoded.)

