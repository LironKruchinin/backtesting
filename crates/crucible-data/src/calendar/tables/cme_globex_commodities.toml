# =========================================================================
# CBOT interest rates
# =========================================================================

[[calendar]]
id = "cme_globex_rates"
description = "CME Globex CBOT US Treasury futures (ZN)"
timezone = "America/Chicago"
roots = ["ZN"]
# The 17:00 CT open starts here. Sunday evenings traded from 17:30 CT through
# 2011-09-25 and from 17:00 CT on 2011-10-02, which makes Monday 2011-10-03 the
# first trading day this template describes.
valid_from = "2011-10-03"
sources = [
  "https://www.cmegroup.com/markets/interest-rates/us-treasury/10-year-us-treasury-note.contractSpecs.html",
  "https://www.cmegroup.com/trading-hours.html",
]

[calendar.session]
open_local = "17:00"
close_local = "16:00"
rth_open_local = "07:20"
rth_close_local = "14:00"
source = "https://www.cmegroup.com/markets/interest-rates/us-treasury/10-year-us-treasury-note.contractSpecs.html"

[calendar.reference_span]
start = "2016-01-01"
end = "2026-01-01"
rationale = """
Ten whole calendar years, well inside the single session era this table \
describes and after the 2012-2015 Friday-before-a-holiday 15:15 CT closes the \
header lists, so none of those unencoded 45-minute days is averaged in."""

[[calendar.holiday]]
name = "New Year's Day"
rule = { kind = "fixed_date", month = 1, day = 1, observance = "sunday_to_monday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Good Friday"
rule = { kind = "good_friday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Christmas Day"
rule = { kind = "fixed_date", month = 12, day = 25, observance = "nearest_weekday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

# Neither Columbus Day nor Veterans Day appears here, and their absence is a
# measurement rather than an oversight. The cash Treasury market observes both
# (SIFMA recommends a full close), and `docs/THETADATA_PLAN.md` §8.1 records
# Veterans Day as a day the NYSE trades and the bond market does not — but CBOT
# Treasury *futures* on Globex traded a full session on every Columbus Day and
# every Veterans Day in the archive. Cash and futures are different markets and
# this table is about the futures.

[[calendar.holiday]]
name = "Martin Luther King Jr. Day"
rule = { kind = "nth_weekday", month = 1, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:00" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Presidents' Day"
rule = { kind = "nth_weekday", month = 2, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:00" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Memorial Day"
rule = { kind = "nth_weekday", month = 5, weekday = "monday", nth = -1 }
effect = { kind = "early_close", close_local = "12:00" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Juneteenth"
rule = { kind = "fixed_date", month = 6, day = 19, observance = "sunday_to_monday" }
effect = { kind = "early_close", close_local = "12:00" }
first_year = 2022
source = "https://www.cmegroup.com/notices/ser/2021/12/SER-8887.pdf"

[[calendar.holiday]]
name = "Independence Day"
rule = { kind = "fixed_date", month = 7, day = 4, observance = "nearest_weekday" }
effect = { kind = "early_close", close_local = "12:00" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Labor Day"
rule = { kind = "nth_weekday", month = 9, weekday = "monday", nth = 1 }
effect = { kind = "early_close", close_local = "12:00" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Thanksgiving Day"
rule = { kind = "nth_weekday", month = 11, weekday = "thursday", nth = 4 }
effect = { kind = "early_close", close_local = "12:00" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Day after Thanksgiving"
rule = { kind = "day_after_nth_weekday", month = 11, weekday = "thursday", nth = 4 }
effect = { kind = "early_close", close_local = "12:15" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Christmas Eve"
rule = { kind = "fixed_date", month = 12, day = 24, observance = "actual" }
effect = { kind = "early_close", close_local = "12:15" }
source = "https://www.cmegroup.com/trading-hours.html"

# There is no "day before Independence Day" rule here, and that is measured:
# ES closed at 12:15 CT on 2013-07-03, 2014-07-03, 2017-07-03, 2018-07-03,
# 2019-07-03, 2023-07-03, 2024-07-03 and 2025-07-03, and ZN traded to 16:00 CT
# on every one of them.

[[calendar.one_off]]
date = "2012-10-29"
name = "Hurricane Sandy — abbreviated session"
# ES stopped at 08:15 CT and ZN at 11:00 CT; 2012-10-30 closed the equity
# market and ZN traded a full session, so there is no ZN entry for it.
effect = { kind = "early_close", close_local = "11:00" }
source = "https://www.cftc.gov/sites/default/files/stellent/groups/public/@rulesandproducts/documents/ifdocs/rul102912cmecbotnymexandcomex1.pdf"

