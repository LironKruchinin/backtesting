# CME FX
# =========================================================================

[[calendar]]
id = "cme_globex_fx"
description = "CME Globex FX futures (6E and its micro)"
timezone = "America/Chicago"
roots = ["6E", "M6E"]
# One session template for the whole archive, so there is no [[calendar.era]]
# here and `valid_from` is simply the archive's first date. It moved back from
# 2015-09-21 with D-0089, once the 2012-2014 closure
# regime and the 2012-04-06 Good Friday were measured and encoded; what remains
# unmodelled before 2015 is the 26 pre-holiday 15:15 CT closes listed in the
# header, which the ZN table has always carried inside its own `valid_from` on
# the same reasoning.
valid_from = "2010-06-06"
sources = [
  "https://www.cmegroup.com/markets/fx/g10/euro-fx.contractSpecs.html",
  "https://www.cmegroup.com/trading-hours.html",
]

[calendar.session]
# 17:00 -> 16:00 CT on every one of the sixteen years. The 2015-09-21 advisory
# that moved CME Equity, CBOT Equity, COMEX and NYMEX from a 16:15 close did
# not name FX, and the archive agrees: the 16:00-16:15 CT window is silent on
# all 280 Mon-Fri dates spanning the change.
open_local = "17:00"
close_local = "16:00"
rth_open_local = "07:20"
rth_close_local = "14:00"
source = "https://www.cmegroup.com/markets/fx/g10/euro-fx.contractSpecs.html"

[calendar.reference_span]
start = "2016-01-01"
end = "2026-01-01"
rationale = """
Ten whole calendar years, entirely inside the only session era this product \
has had in the archive. The 2022 disappearance of the US-holiday early close \
moves session length on seven days a year and does not change the template, so \
it is not an era and the span may cross it. It also starts after the 26 \
pre-holiday 15:15 CT closes the header lists, so none of those unencoded \
45-minute days is averaged in."""

[[calendar.holiday]]
name = "New Year's Day"
rule = { kind = "fixed_date", month = 1, day = 1, observance = "sunday_to_monday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Good Friday"
# Closed in a normal year; the Employment-Situation years ran to 10:15 CT and
# are dated one-offs below, which take precedence.
rule = { kind = "good_friday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Christmas Day"
rule = { kind = "fixed_date", month = 12, day = 25, observance = "nearest_weekday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

# The seven US holidays, in three regimes. FX closed at noon like everything
# else from 2010, was fully shut over 2012-11-22..2014-02-17 like everything
# else, went back to noon, and then stopped observing them entirely in 2022 —
# MLK 2022-01-17 traded to 15:58 CT on a day ES stopped at 12:00. There is no
# `first_year = 2022` entry, because after 2021 there is nothing to encode.

[[calendar.holiday]]
name = "Martin Luther King Jr. Day"
rule = { kind = "nth_weekday", month = 1, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:00" }
first_year = 2015
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
