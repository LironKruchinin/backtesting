# =========================================================================
# CME FX
# =========================================================================

[[calendar]]
id = "cme_globex_fx"
description = "CME Globex FX futures (6E and its micro)"
timezone = "America/Chicago"
roots = ["6E", "M6E"]
# The session template is unchanged across the whole archive, so valid_from
# could go back to 2010-06-06. It does not, because the holiday schedule this
# table encodes was measured from 2015 onwards and the 2012-2015 Friday-before-
# a-Monday-holiday 15:15 CT closes (listed in the header) have no rule. Claiming
# 2010 would be claiming a holiday set that is known to be incomplete there.
valid_from = "2015-09-21"
sources = [
  "https://www.cmegroup.com/markets/fx/g10/euro-fx.contractSpecs.html",
  "https://www.cmegroup.com/trading-hours.html",
]

[calendar.session]
open_local = "17:00"
close_local = "16:00"
rth_open_local = "07:20"
rth_close_local = "14:00"
source = "https://www.cmegroup.com/markets/fx/g10/euro-fx.contractSpecs.html"

[calendar.reference_span]
start = "2016-01-01"
end = "2026-01-01"
rationale = """
Ten whole calendar years, entirely inside the only session era this product \
has had in the archive. The 2022 disappearance of the US-holiday early close \
moves session length on seven days a year and does not change the template, so \
it is not an era and the span may cross it."""

[[calendar.holiday]]
name = "New Year's Day"
rule = { kind = "fixed_date", month = 1, day = 1, observance = "sunday_to_monday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Good Friday"
# Closed in a normal year; the Employment-Situation years ran to 10:15 CT and
# are dated one-offs below, which take precedence.
rule = { kind = "good_friday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Christmas Day"
rule = { kind = "fixed_date", month = 12, day = 25, observance = "nearest_weekday" }
effect = { kind = "closed" }
source = "https://www.cmegroup.com/trading-hours.html"

# The seven US holidays, which stopped being early closes for FX in 2022. MLK
# 2022-01-17 traded to 15:58 CT — a full session — on a day ES stopped at 12:00.
# `last_year` is what says so; there is no `first_year = 2022` counterpart,
# because after 2021 there is nothing to encode.

[[calendar.holiday]]
name = "Martin Luther King Jr. Day"
rule = { kind = "nth_weekday", month = 1, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:00" }
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Presidents' Day"
rule = { kind = "nth_weekday", month = 2, weekday = "monday", nth = 3 }
effect = { kind = "early_close", close_local = "12:00" }
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Memorial Day"
rule = { kind = "nth_weekday", month = 5, weekday = "monday", nth = -1 }
effect = { kind = "early_close", close_local = "12:00" }
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

[[calendar.holiday]]
name = "Independence Day"
rule = { kind = "fixed_date", month = 7, day = 4, observance = "nearest_weekday" }
effect = { kind = "early_close", close_local = "12:00" }
last_year = 2021
source = "https://www.cmegroup.com/trading-hours.html"

