[package]
name = "crucible-data"
description = "Data acquisition, archive/catalog, calendars, continuous contracts, and synthetic feeds."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Everything that talks to Databento. Non-default (D-0025): a plain build of
# this crate stays pure-std plus serde/blake3, `cargo check` stays instant, and
# `.await` exists in exactly one file. CI builds `--all-features` so the gated
# module cannot rot unnoticed.
databento = ["dep:databento", "dep:tokio", "dep:sha2", "dep:time"]
# Everything that talks to ThetaData. Same seam as `databento` (D-0025): async
# lives in exactly one module, behind a sync API, on a private current-thread
# runtime. `reqwest` was already in the graph transitively under `databento`,
# so this feature adds a direct edge rather than a second HTTP stack, and asks
# for no TLS at all — the Theta Terminal is a plaintext HTTP server on
# localhost, and a TLS backend we never use is a dependency we should not pay
# for (D-0051).
thetadata = ["dep:reqwest", "dep:tokio"]

[dependencies]
crucible-core = { path = "../crucible-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"

# `calendar` only, and the only timezone-aware code in the workspace
# (CLAUDE.md §4, §6). We ask for chrono without its `clock` feature, but that
# is a statement of intent and NOT a guarantee: Cargo unifies features across
# the graph and `parquet` enables `chrono/clock`, so `Utc::now()` compiles here
# regardless. The actual guarantee is the `disallowed-methods` entry in
# `clippy.toml`, which is a merge gate (D-0048). chrono-tz carries the IANA
# database, which is the whole reason to take the dependency — US
# daylight-saving law has been amended before and hand-rolling the rule is how
# a calendar goes quietly wrong.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# Calendar tables are TOML data files, compiled in with `include_str!` rather
# than read at runtime so the same config cannot mean two things on two
# machines. Already blessed for `data` in CLAUDE.md §6.
toml = "0.9"

# Acquisition. Async; reached only through the sync `ingest::BatchProvider`
# seam in `ingest::databento`, which owns a private current-thread runtime.
# DBN decoding comes from this crate's `databento::dbn` re-export rather than a
# separately pinned `dbn`, so the client and the decoder cannot drift apart.
databento = { version = "0.55", optional = true }
# `sync` carries `Semaphore`/`Mutex`, which `external::thetadata::pacer` uses
# for the one global launch governor. Not threads: these are async primitives
# multiplexed onto the same current-thread runtime (D-0025, D-0051).
tokio = { version = "1.53", features = [
    "rt",
    "time",
    "net",
    "sync",
], optional = true }
# ThetaData acquisition. `default-features = false` drops every TLS backend,
# blocking client, and codec we do not use: the Theta Terminal serves plain
# HTTP/1.1 on 127.0.0.1, so a TLS stack here would be dead weight that still
# had to be audited and compiled. Reached only through `external::thetadata`.
reqwest = { version = "0.13", default-features = false, optional = true }
# Verifying a delivered file against the vendor's published digest before it
# is allowed into the immutable archive.
sha2 = { version = "0.11", optional = true }
# Not a choice: the Databento API spells its timestamps `time::OffsetDateTime`,
# so the adapter has to name the type to convert them to `Ts` nanoseconds. It
# appears nowhere outside `ingest::databento`.
time = { version = "0.3", optional = true }

# Curated Parquet: the low-level typed-column API only (D-0037). Default
# features off drops arrow, async, object_store, and every codec but the one
# we write — so this crate gains no threads and no runtime, which `polars`
# could not offer (polars-core depends on rayon non-optionally, and CLAUDE.md
# §3 reserves thread-spawning for crucible-funnel).
parquet = { version = "59.1", default-features = false, features = ["zstd"] }

# --- Milestone M1 additions (do not add before implementing; CLAUDE.md §6) ---
# polars = "..."      # data-QA report only (gaps/spikes/DST); NOT the feed path

[dev-dependencies]
# Property tests for the coverage interval algebra (CLAUDE.md §6). Default
# features off: `fork`/`timeout` only matter for tests that crash the process,
# and they drag in tempfile/rusty-fork/wait-timeout for nothing here.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
