[package]
name = "crucible-data"
description = "Data acquisition, archive/catalog, calendars, continuous contracts, and synthetic feeds."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crucible-core = { path = "../crucible-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"

# --- Milestone M1 additions (do not add before implementing; CLAUDE.md §6) ---
# databento = "..."   # official client; async — tokio stays CONFINED to this crate's bin targets
# dbn = "..."         # DBN decoding
# polars = "..."      # Parquet read/write + transcode (lazy, feature-gated)

[dev-dependencies]
# Property tests for the coverage interval algebra (CLAUDE.md §6). Default
# features off: `fork`/`timeout` only matter for tests that crash the process,
# and they drag in tempfile/rusty-fork/wait-timeout for nothing here.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
