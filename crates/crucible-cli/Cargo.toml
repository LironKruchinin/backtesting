[package]
name = "crucible-cli"
description = "Command-line entry point. Thin: parses args, wires crates together, prints."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "crucible"
path = "src/main.rs"

[dependencies]
crucible-core = { path = "../crucible-core" }
crucible-data = { path = "../crucible-data" }
crucible-engine = { path = "../crucible-engine" }
crucible-funnel = { path = "../crucible-funnel" }
crucible-strategies = { path = "../crucible-strategies" }
# `.env` -> process environment, in BIN TARGETS ONLY (D-0022). Library code
# never reads the environment, so this must not migrate into any lib crate.
dotenvy = "0.15"
# Real arg parsing: `pull` takes value-carrying flags whose misreading would
# cost money, which is exactly the point at which §6 blesses clap.
clap = { version = "4.6", features = ["derive"] }

[features]
# Forwards to crucible-data. Non-default, so `cargo check` and the default CI
# gates stay free of tokio/reqwest; CI runs a second pass with --all-features.
databento = ["crucible-data/databento"]

[lints]
workspace = true
