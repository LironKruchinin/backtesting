# Personal cash futures account, $100000 baseline
#
# An ACCOUNT, as data. Pairs with a strategy config (`configs/*-combo.toml`) to
# form one evaluation identity; the methodology, the engine capture contract and
# the metric battery live in `docs/ACCOUNT_EVAL_SPEC.md`. Nothing here describes
# execution costs — those stay in the strategy config's named `[execution]` fill
# model (CLAUDE.md §2.4), because an account rule and a cost assumption are
# different claims and must not share a field.
#
# Money is a decimal STRING in USD (D-0027); the loader parses it to
# `_nano_usd` integers. Percentages are f64 on a 0-100 scale (§4).
#
# VERIFICATION: there is no firm and there are no firm rules to verify. The one
# number a cash account would need from an outside authority is the margin
# requirement, and `[margin]` explains why it is empty rather than guessed
# (accessed 2026-07-30).
#
# The control arm. No firm, no profit target, no threshold, nothing to breach
# -- which is the whole point of keeping these beside the prop files: every
# metric that differs between `personal_100k` and a prop account of the same
# size, on the same strategy and the same window, is attributable to the
# ACCOUNT RULE and nothing else. That is the comparison the prop numbers only
# mean something inside of.
#
# `[ruin]` replaces breach probability. `[margin]` is deliberately empty and
# says why.

schema_version = 1

[account]
id = "personal_100k"
firm = "none"
product = "self-funded cash account"
phase = "cash"
kind = "cash"
nominal_size_usd = "100000"
starting_balance_usd = "100000"

# Whether this project's output -- an automated strategy -- may legally be
# run on this account. Closed set: forbidden | conditional | unknown.
# `unknown` is a VALUE, not a placeholder to be guessed away: it means no
# stance was found on the firm's own pages, and it must not be read as
# permission. Cited like everything else in `[source]`.
automation_policy = "unknown"
automation_policy_source_url = "https://www.cmegroup.com/solutions/risk-management/performance-bonds-margins.html"
automation_policy_accessed_date = "2026-07-30"
# There is no firm, so there is no firm policy to cite. What
# governs an automated strategy here is the chosen BROKER's own
# automated-trading and API terms, and no broker is named in
# this config -- so nothing was verified and the value is
# `unknown`. It becomes verifiable the day a broker is chosen.
# The cited URL is the only outside authority this file has and
# it is about margin, not automation; it is named because the
# field's citation discipline is not waived just because the
# answer is unknown.

# TRUE means the firm's own rules forbid running this project's output on
# the funded account this evaluation leads to. It does NOT mean excluded:
# a reference-only account is evaluated by the full battery, because its
# rule STRUCTURE is what measures strategy fragility, which is the
# research question. Which product to actually target is an M4 decision,
# taken against rules re-verified at that time -- they will have changed.
reference_only = false

[source]
rule_pages = [
  "https://www.cmegroup.com/solutions/risk-management/performance-bonds-margins.html",
]
accessed_date = "2026-07-30"
page_last_updated = "unstated"

[session]
# The firm's trading day, which is NOT the exchange session. Daily PnL is
# sliced on this day boundary via `crucible-data::calendar` (§4 pins fold
# windows in trading days for the same reason a wall-clock day is wrong
# here: 18:00 CT Monday is Tuesday's session).
calendar_id = "cme_globex_equity_index"

[position_limit]
scaling = "none"
# No firm-imposed cap. The real cap is margin, which is
# unmodelled (see `[margin]`), so `max_contracts` is absent:
# size comes from the strategy config's `qty_contracts` and
# the report must say that no margin cap was checked.

[ruin]
# A cash account cannot be 'breached' -- there is no firm to close
# it -- so risk-of-ruin replaces breach probability (ACCOUNT_EVAL_SPEC
# §4.5). This threshold is OUR pre-declared research parameter, not
# anybody's rule, and every report that quotes a ruin probability must
# print the threshold beside it.
threshold_cum_pnl_pct = -50.0
basis = "equity_including_unrealized"

[margin]
# DELIBERATELY EMPTY, AND A HUMAN TASK. CME performance bonds change
# by clearing advisory (several times a year), so a number pasted
# here would be a stale constant wearing a spec's clothes -- and
# CME's Data Terms of Use forbid automated retrieval while their site
# blocks it outright, so no automated process may fill this in.
#
# WHICH NUMBER IS WANTED: the EXCHANGE MAINTENANCE margin, as the
# conservative baseline. Broker day-trading margins are far smaller
# and are a future refinement, not the baseline -- and where the two
# differ, the conservative (larger) figure is chosen, because it caps
# position size lower and so understates rather than flatters what
# the account could hold. Paste it with `as_of_date`, by hand:
#   initial_margin_per_contract_usd = "..."
#   maintenance_margin_per_contract_usd = "..."
#   as_of_date = "YYYY-MM-DD"
# Or leave them absent and accept that the contract-count cap is
# unmodelled -- which is what absent MEANS here. It must never be
# silently defaulted.
#   https://www.cmegroup.com/markets/equities/sp/e-mini-sandp500.margins.html
#   https://www.cmegroup.com/markets/equities/sp/micro-e-mini-sandp-500.margins.html
#   https://www.cmegroup.com/solutions/risk-management/performance-bonds-margins.html
