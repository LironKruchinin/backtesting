# Reference config: Bollinger mean-reversion gated by an EMA trend filter.
# This file is the canonical example of the config schema, and it is parsed by
# the real loader — `crucible combo --config configs/example-combo.toml`
# expands it and prints the grid. Semantics live in
# `crucible-strategies::combo`; the parser lives in `crucible-cli::config`.
#
# Parsing rules (CLAUDE.md §5.5):
# - unknown fields are a HARD ERROR (deny_unknown_fields) — typos must not
#   silently become no-ops in a research pipeline
# - every config declares schema_version and a hypothesis_family
# - integer ranges: { start, end, step } (inclusive) or explicit lists; float
#   axes are explicit lists ONLY, because a stepped float axis has a
#   floating-point-dependent length (D-0060)
# - money is written as a decimal STRING ("1.25", not 1.25): it parses to
#   integer nanodollars without ever constructing an f64 (D-0027)
#
# This config names a continuous contract, so `--run` refuses it: replaying a
# back-adjusted series needs a consumer that says which of the two price
# series it wants (D-0042). `configs/combo-smoke.toml` is the runnable one.

schema_version = 1

[meta]
name = "bb-meanrev-ema-filter"
# Trial-registry key: every run under this family increments the trial count
# that feeds the deflated Sharpe. Choose the family honestly — it should
# cover the whole idea, not one parameterization of it.
hypothesis_family = "es-meanrev-bb"
# One sentence. If you can't write it, the idea isn't ready to test.
economic_rationale = "Short-horizon overreaction in ES mean-reverts intraday except in strong trends; the EMA filter avoids fighting the trend."

[universe]
# One instrument and one timeframe today: the cross-product over a universe is
# the funnel's job (M3), and `combo` refuses rather than silently running the
# first entry of a list it cannot fully evaluate.
instruments = ["ES.v.0"]   # volume-rolled continuous; raw contracts also valid
timeframes = ["5m"]

[data]
source = "curated"          # "curated" | "synthetic"
start = "2012-01-01"        # inclusive UTC date
end = "2026-06-30"          # exclusive UTC date

[contract]
# Named, not implied (§2.4). Decimal text to integers, never through f64.
tick_points = "0.25"
point_value_usd = 50

[indicators.bb]
kind = "bollinger"
period = { start = 10, end = 40, step = 5 }
k = [1.5, 2.0, 2.5]

[indicators.trend]
kind = "ema"
period = [100, 200]

[rules]                      # evaluated on completed bars only
enter_long = "close < bb.lower and close > trend"
exit_long = "close > bb.mid"
enter_short = "close > bb.upper and close < trend"
exit_short = "close < bb.mid"

[execution]
fill_model = "spread_cross"  # "free_fills" is only legal in stages s0/s1
half_spread_ticks = 1
fee_per_contract_usd = "1.25"

[walk_forward]               # consumed by `crucible walk-forward`
scheme = "rolling"           # "rolling" | "anchored"
# TRADING DAYS, not months (D-0062). A "6-month" window holds anywhere from
# 122 to 130 CME sessions depending on where it lands, so a fold layout
# written in months has a sample size the exchange's holiday schedule picks.
train_days = 504             # two years of sessions
test_days = 126              # one half-year
step_days = 126              # tile exactly; this is also the default, and a
                             # smaller value is refused (the headline pools
                             # the test windows, and overlap double-counts)

[funnel]                     # consumed by `crucible funnel`
# Stages this build implements. `s0` (signal triage) and `s3` (the overfitting
# battery) are REFUSED rather than skipped: a config that asks for the
# permutation battery and silently receives a fold table has been answered with
# a different question than the one it asked.
stages = ["s1", "s2"]
# Mandatory, all four levels (§2.4) — it is not a list to trim, because
# dropping the level an edge dies at is how a cost sensitivity stops being one.
# Every entry is a whole number of half-ticks (D-0073).
cost_sensitivity_ticks = [0.0, 0.5, 1.0, 2.0]
# Pre-registered kill criteria — written BEFORE running, judged by machines,
# and stored on the registry row that is inserted before the run. A threshold
# chosen after seeing the result is not a criterion.
min_oos_trades = 30          # sample adequacy: fewer and there is nothing to
min_oos_sessions = 60        # measure, whatever the return says
min_oos_return_pct_free_fills = 0.0   # S1: dead cheaply if it loses cost-free
min_oos_sharpe_after_costs = 0.5      # S2, under the declared fill model
kill_if_dead_at_ticks = 1.0  # ...and still, at this much half-spread
require_controls_beaten = true        # vs matched random-entry AND buy-and-hold
# Declared and echoed; NOT evaluated by this build (they are S3), and the
# scorecard renders both as named holes rather than leaving them out.
max_pbo = 0.5
require_plateau = true

[run]
seed = 42
initial_cash_usd = "100000"
qty_contracts = 1
