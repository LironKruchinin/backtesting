# The runnable combo config: a 6-point SMA-crossover grid on a seeded random
# walk. This is the null harness, not an idea — there is no edge in a random
# walk, so anything this prints that looks like one is a bug in the engine.
#
#   crucible combo --config configs/combo-smoke.toml            # expand
#   crucible combo --config configs/combo-smoke.toml --run      # and replay
#   crucible combo --config configs/combo-smoke.toml --run --hash-only
#
# The last form is the determinism gate: same config + same data must produce
# a bit-identical hash on any machine (CLAUDE.md §2.2).

schema_version = 1

[meta]
name = "syn-sma-cross-null"
hypothesis_family = "null-harness-sma-cross"
economic_rationale = "None, deliberately: the feed is a seeded random walk, so this config exists to prove the machinery is deterministic and fair, never to find edge."

[universe]
# The synthetic random walk emits SYN:RW, and the config has to say so — a
# contract spec labelled with an instrument the feed never emits is a header
# that lies.
instruments = ["SYN:RW"]
timeframes = ["1m"]

[data]
source = "synthetic"
# Seeds the bar generator (SplitMix64, D-0011). Distinct from [run] seed,
# which seeds strategy randomness — no strategy takes one yet.
seed = 42
bars = 20000
start_price_points = "5000"
vol_ticks = 4

[contract]
tick_points = "0.25"
point_value_usd = 50

[indicators.fast]
kind = "sma"
period = [10, 20]

[indicators.slow]
kind = "sma"
period = { start = 50, end = 100, step = 25 }

# Stop-and-reverse: the same crossover exits one side and enters the other, so
# a cross emits one order for twice the size. This is `SmaCross` written in
# TOML, and there is a test asserting the two produce identical intents.
[rules]
enter_long = "fast crosses_above slow"
exit_long = "fast crosses_below slow"
enter_short = "fast crosses_below slow"
exit_short = "fast crosses_above slow"

[execution]
fill_model = "spread_cross"
half_spread_ticks = 1
fee_per_contract_usd = "1.25"

# Folds for `crucible walk-forward`, in TRADING DAYS (D-0062). The synthetic
# feed has no exchange, so "trading day" here means UTC civil day and the
# command says so on every run. 20,000 1m bars is just under 14 of them.
[walk_forward]
scheme = "rolling"
train_days = 5
test_days = 2
step_days = 2

# Pre-registered kill criteria for `crucible funnel`, written BEFORE the run
# and stored verbatim on the registry row that is inserted before the run.
#
# This config is the null harness, so the honest thresholds are the ones a
# random walk fails: the sample minimums are set low enough that the 20,000-bar
# fixture reaches them (so the gates are actually exercised rather than
# short-circuiting at S0), and the performance bars are set where a real idea
# would have to clear them. A run of this file that reports anything other than
# KILL for every combo is a bug in the engine, not an edge.
[funnel]
# s0 (signal triage) runs since D-0085 — see s0-smoke.toml beside this file,
# which declares it. s3 (the overfitting battery) is still NOT declarable, and a
# config that names it is refused rather than silently skipped.
stages = ["s1", "s2"]
# Mandatory, all four levels (CLAUDE.md §2.4). Every entry must be a whole
# number of half-ticks — a price grid has half-ticks, not tenths (D-0073).
cost_sensitivity_ticks = [0.0, 0.5, 1.0, 2.0]
min_oos_trades = 5
min_oos_sessions = 4
min_oos_return_pct_free_fills = 0.0
min_oos_sharpe_after_costs = 0.5
kill_if_dead_at_ticks = 1.0
require_controls_beaten = true
# max_pbo is EVALUATED since D-0109 and renders as a number. require_plateau is
# declared and echoed but NOT evaluated, which is why the scorecard still
# renders that one as a named hole rather than leaving it out.
max_pbo = 0.5
require_plateau = true

[run]
seed = 42
initial_cash_usd = "100000"
qty_contracts = 1
