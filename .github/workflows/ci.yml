name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # §2.2 says "same config + same data => bit-identical results, on any
      # machine". It does not carve out an optimisation level — and until
      # D-0122 this job only ever ran `dev`, so the deflated-Sharpe gate was
      # measuring dev-profile determinism while claiming determinism. It
      # disagreed with `--release` for as long as it existed and nothing here
      # could see it. This step is that fix's regression guard.
      - name: Tests (release profile)
        run: cargo test --workspace --release

      # The five CLI gates are hash-emitting binaries, so the profile question
      # applies to them too: they are compared BY VALUE across profiles rather
      # than each against a second run of itself.
      - name: Gates agree across build profiles
        run: |
          for cmd in "demo --hash-only"                      "combo --config configs/combo-smoke.toml --run --hash-only"                      "walk-forward --config configs/combo-smoke.toml --hash-only"; do
            D=$(cargo run -q -p crucible-cli -- $cmd)
            R=$(cargo run -q --release -p crucible-cli -- $cmd)
            test -n "$D" || { echo "NO OUTPUT (dev): $cmd"; exit 1; }
            test "$D" = "$R" || { echo "PROFILE DIVERGENCE on $cmd: dev $D vs release $R"; exit 1; }
            echo "profile-stable: $cmd = $D"
          done
          for cfg in combo-smoke s0-smoke; do
            D=$(cargo run -q -p crucible-cli -- funnel --config configs/$cfg.toml                   --out "$RUNNER_TEMP/pd-$cfg" --hash-only)
            R=$(cargo run -q --release -p crucible-cli -- funnel --config configs/$cfg.toml                   --out "$RUNNER_TEMP/pr-$cfg" --hash-only)
            test -n "$D" || { echo "NO OUTPUT (dev): $cfg"; exit 1; }
            test "$D" = "$R" || { echo "PROFILE DIVERGENCE on $cfg: dev $D vs release $R"; exit 1; }
            echo "profile-stable: funnel $cfg = $D"
          done

      # Determinism gate: the demo backtest must produce bit-identical results
      # across two runs. Any nondeterminism in the engine fails CI.
      - name: Determinism smoke test
        run: |
          A=$(cargo run -q -p crucible-cli -- demo --hash-only)
          B=$(cargo run -q -p crucible-cli -- demo --hash-only)
          test "$A" = "$B" && echo "deterministic: $A"

      # The funnel gate. It is a *different* claim from the demo's: the demo
      # hashes one strategy's equity curve, this hashes six combos' verdicts,
      # the criteria they were judged against, both controls, all four sweep
      # levels and the captured day series — which is the first thing here
      # that runs across rayon's pool, and therefore the first place a result
      # could depend on completion order (§2.2).
      #
      # The wall clock is deliberately outside the hash: two runs a minute
      # apart must agree, and a timestamp is metadata rather than a result.
      - name: Funnel determinism gate
        run: |
          A=$(cargo run -q -p crucible-cli -- funnel \
                --config configs/combo-smoke.toml --out "$RUNNER_TEMP/results" --hash-only)
          B=$(cargo run -q -p crucible-cli -- funnel \
                --config configs/combo-smoke.toml --out "$RUNNER_TEMP/results" --hash-only)
          test "$A" = "$B" && echo "deterministic: $A"

  # The `databento` feature is non-default (D-0025), so the job above never
  # compiles the one file in the workspace containing `.await`. A feature
  # nothing builds is a feature that rots — and this one is the code that
  # spends money. Separate job because it drags in tokio/reqwest/dbn and
  # should not slow the gate that every push actually waits on.
  #
  # No network is touched: these tests drive faked providers only.
  feature-databento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (all features)
        run: cargo clippy --all-targets --workspace --all-features -- -D warnings

      - name: Tests (all features)
        run: cargo test --workspace --all-features
