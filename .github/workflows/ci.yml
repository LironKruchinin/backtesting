name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Determinism gate: the demo backtest must produce bit-identical results
      # across two runs. Any nondeterminism in the engine fails CI.
      - name: Determinism smoke test
        run: |
          A=$(cargo run -q -p crucible-cli -- demo --hash-only)
          B=$(cargo run -q -p crucible-cli -- demo --hash-only)
          test "$A" = "$B" && echo "deterministic: $A"

  # The `databento` feature is non-default (D-0025), so the job above never
  # compiles the one file in the workspace containing `.await`. A feature
  # nothing builds is a feature that rots — and this one is the code that
  # spends money. Separate job because it drags in tokio/reqwest/dbn and
  # should not slow the gate that every push actually waits on.
  #
  # No network is touched: these tests drive faked providers only.
  feature-databento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (all features)
        run: cargo clippy --all-targets --workspace --all-features -- -D warnings

      - name: Tests (all features)
        run: cargo test --workspace --all-features
